name: fetch

on:
  push:
    branches: [main]
    paths:
      - "fetch.py"
      - "config.json"
      - ".github/workflows/fetch.yml"
  workflow_dispatch:
    # 抓取只由 sl 的 hwsignal-dispatch.sh 触发（每小时 :05/:35）。
    # 不用 schedule：GitHub 的定时本来就常延迟/跳过，留着只会和 dispatch 重复。

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feeds
        run: python3 fetch.py

      - name: Publish snapshot to data branch
        run: |
          git config user.name "hw-signal-bot"
          git config user.email "bot@hwsignal.invalid"
          blob=$(git hash-object -w data/items-raw.json)
          tree=$(printf '100644 blob %s\titems-raw.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "data: $(date -u +%Y-%m-%dT%H:%MZ)")
          git push --force origin "$commit":refs/heads/data
