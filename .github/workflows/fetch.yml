name: fetch

on:
  schedule:
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths:
      - "fetch.py"
      - "config.json"
      - ".github/workflows/fetch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feeds
        run: python3 fetch.py

      - name: Commit if changed
        run: |
          git config user.name "hw-signal-bot"
          git config user.email "bot@hwsignal.invalid"
          if git diff --quiet -- data/items-raw.json; then
            echo "no change"
            exit 0
          fi
          git add data/items-raw.json
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
