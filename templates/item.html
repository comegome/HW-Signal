<article class="item">
  <div class="kicker"><span class="src">{{source}}</span>{{category_html}}</div>
  <h1 class="headline">{{title}}</h1>
  <div class="meta-line">{{published}}</div>
  {{body_html}}
  <div class="origin">
    原文：<a href="{{url}}" rel="noopener nofollow" target="_blank">在 {{source}} 阅读全文 →</a>
    <div class="en">{{title_en}}</div>
  </div>
</article>
