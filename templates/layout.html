<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{canonical_root}}/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/rss+xml" title="{{site}}" href="/feed.xml">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
{{head_extra}}
<link rel="stylesheet" href="/style.css?v={{cssver}}">
<script>(function(){try{var h=document.documentElement;var t=localStorage.getItem("hwsignal-theme");if(!t)t=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";h.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="/"><span class="dot"></span>{{site}}</a>
  <div class="mast-right"><nav class="main">{{nav}}</nav><button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
</div></header>
<main><div class="wrap">{{content}}</div></main>
<footer class="site"><div class="wrap">
  <span>Checked hourly · 内容来自 VideoCardz 与 Tom's Hardware</span>
  <a href="/about/">关于</a>
  <a href="/feed.xml">RSS</a>
  <a href="/sitemap.xml">Sitemap</a>
  <span class="sp">© {{year}} {{site}}</span>
</div></footer>
<script>(function(){var b=document.getElementById("theme-toggle");if(!b)return;b.addEventListener("click",function(){try{var h=document.documentElement;var cur=h.getAttribute("data-theme");var sys=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";var next=cur?(cur==="dark"?"light":"dark"):(sys==="dark"?"light":"dark");h.setAttribute("data-theme",next);localStorage.setItem("hwsignal-theme",next);}catch(e){}});})();</script>
</body>
</html>
